name: Render Services Keep-Alive & Health Monitor

# ─── Why this workflow is a BACKUP, not the primary keep-alive ─────────────────
#
# Render Free web services spin down after 15 minutes without inbound traffic and
# take up to about a minute to wake (https://render.com/docs/free).
#
# GitHub does not run `schedule` triggers on time. They can be delayed during
# high load, and some are dropped. In this repository a cron asking for ~75 runs
# a day was actually run about twice a day (Nov 2026 run history), which cannot
# keep anything awake. The primary pinger is therefore an external scheduler
# (cron-job.org — see docs/RUNBOOK.md, "Keeping the Render free services awake").
# This workflow stays as a second pinger and as a loud health check: it now FAILS
# (red) when it is not configured or a service does not answer, instead of
# showing a green tick while doing nothing.
#
# ─── Free-hour budget ───────────────────────────────────────────────────────────
# Render grants 750 free instance hours per WORKSPACE per month, shared by every
# free service in it. When they run out, Render suspends ALL free services until
# the next month. Two services kept awake 24/7 would need ~1,488 h, so the
# window is limited to 03:00–13:59 UTC (08:30–19:30 Sri Lanka time):
#   ~11.25 h/day (incl. the 15-min tail) × 2 services × 31 days ≈ 700 h  < 750 h.
# Widen it only if the Render workspace has hours to spare.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RENDER_BACKEND_URL  e.g. https://textile-automation-platform.onrender.com
#   RENDER_AI_URL       e.g. https://textile-automation-platform-ai.onrender.com

on:
  schedule:
    - cron: '*/10 3-13 * * *'
  workflow_dispatch:
    inputs:
      custom_backend_url:
        description: 'Optional custom backend URL to ping'
        required: false
        type: string
      custom_ai_url:
        description: 'Optional custom AI service URL to ping'
        required: false
        type: string

# Least privilege: the job only sends HTTP requests.
permissions:
  contents: read

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    name: Ping Services
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Resolve service URLs
        id: config
        env:
          INPUT_BACKEND_URL: ${{ inputs.custom_backend_url }}
          INPUT_AI_URL: ${{ inputs.custom_ai_url }}
          SECRET_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
          SECRET_AI_URL: ${{ secrets.RENDER_AI_URL }}
        run: |
          BACKEND_URL="${INPUT_BACKEND_URL:-$SECRET_BACKEND_URL}"
          AI_URL="${INPUT_AI_URL:-$SECRET_AI_URL}"
          BACKEND_URL="${BACKEND_URL%/}"
          AI_URL="${AI_URL%/}"

          # Missing configuration is a failure, not a notice. The old version
          # skipped both pings on every run for a week and still showed green.
          missing=0
          if [ -z "$BACKEND_URL" ]; then
            echo "::error ::RENDER_BACKEND_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            missing=1
          fi
          if [ -z "$AI_URL" ]; then
            echo "::error ::RENDER_AI_URL secret is not set. Add it in Settings → Secrets and variables → Actions."
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1

          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"
          echo "ai_url=$AI_URL" >> "$GITHUB_OUTPUT"

      - name: Ping backend and AI service
        env:
          BACKEND_HEALTH: ${{ steps.config.outputs.backend_url }}/api/v1/health
          AI_HEALTH: ${{ steps.config.outputs.ai_url }}/health
        run: |
          # Polls one health URL until it returns HTTP 200, for up to ~2.5 min:
          # a cold Render free instance takes up to about a minute to wake.
          ping_until_healthy() {
            name="$1"; url="$2"
            body=$(mktemp)  # one file per call: the two pings run in parallel
            for attempt in 1 2 3 4 5 6; do
              # curl already prints 000 when it cannot connect; `|| true` only
              # stops its non-zero exit from ending the loop.
              code=$(curl -s -o "$body" -w '%{http_code}' --max-time 25 "$url") || true
              echo "$name attempt $attempt: HTTP ${code:-000}"
              if [ "$code" = "200" ]; then
                echo "✅ $name healthy: $(head -c 300 "$body")"
                return 0
              fi
              sleep 5
            done
            echo "::error ::$name did not return HTTP 200 ($url)"
            return 1
          }

          # Ping both in parallel so a cold start on one does not delay the other.
          ping_until_healthy "Backend" "$BACKEND_HEALTH" & b=$!
          ping_until_healthy "AI service" "$AI_HEALTH" & a=$!
          status=0
          wait $b || status=1
          wait $a || status=1
          exit $status
