name: Playwright nightly
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '15 20 * * *'

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: textile_admin
          POSTGRES_PASSWORD: textile_ci_password
          POSTGRES_DB: textile_pw_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U textile_admin -d textile_pw_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://textile_admin:textile_ci_password@127.0.0.1:5432/textile_pw_ci?schema=public
      DIRECT_URL: postgresql://textile_admin:textile_ci_password@127.0.0.1:5432/textile_pw_ci?schema=public
      NODE_ENV: test
      PORT: 3001
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions
      ALLOW_DEV_OTP_BYPASS: 'true'
      FRONTEND_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001/api/v1
      INTERNAL_BACKEND_URL: http://127.0.0.1:3001
      PW_BASE_URL: http://127.0.0.1:3000
      PW_API_URL: http://127.0.0.1:3001/api/v1
      AI_SERVICE_URL: http://127.0.0.1:1
      PAYHERE_MODE: sandbox
      PAYHERE_MERCHANT_ID: '1221149'
      PAYHERE_MERCHANT_SECRET: ci-only-sandbox-secret
      PAYHERE_NOTIFY_URL: http://127.0.0.1:3001/api/v1/payments/payhere/notify
      PW_FIREFOX: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/start-stack

      - name: Install Playwright browsers
        working-directory: frontend
        run: |
          browsers=(chromium webkit)
          if [[ "$PW_FIREFOX" == 1 ]]; then browsers+=(firefox); fi
          npx --no-install playwright install --with-deps "${browsers[@]}"

      - name: Run Playwright
        id: tests
        working-directory: frontend
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/junit.xml
        run: |
          args=(--grep-invert @ai-live --fail-on-flaky-tests --reporter=github,html,junit)
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            args+=(--project=chromium --grep '@smoke|@critical')
          elif [[ "$PW_FIREFOX" == 1 ]]; then
            args+=(--repeat-each=2)
          fi
          npm run test:pw -- "${args[@]}"

      - name: Reconcile inventory
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        working-directory: backend
        run: npm run reconcile

      - name: Summarize browser results
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET
          path = pathlib.Path("frontend/test-results/junit.xml")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              print("### Playwright", file=out)
              if path.exists():
                  cases = ET.parse(path).findall(".//testcase")
                  failed = [c for c in cases if c.find("failure") is not None or c.find("error") is not None]
                  print(f"{len(cases)} test cases, {len(failed)} failures.", file=out)
                  for case in failed[:20]:
                      print(f"- {case.get('classname')} — {case.get('name')}", file=out)
              else:
                  print("No browser report was produced. See the setup and browser steps.", file=out)
          PY

      - name: Show service logs on failure
        if: failure()
        run: tail -n 100 backend/backend.log frontend/frontend.log || true

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload failure traces and screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failures
          path: frontend/test-results/
          if-no-files-found: ignore

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-service-logs
          path: |
            backend/backend.log
            frontend/frontend.log
          if-no-files-found: ignore
